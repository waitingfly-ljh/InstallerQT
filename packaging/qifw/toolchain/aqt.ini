; aqtinstall config for this repo.
;
; baseurl must be the site root: aqt appends online/qtsdkrepository/<os>/<target>/.
; download.qt.io 302-redirects archives to a CDN mirror, and aqt's default 5s
; connection timeout is too short for that hop, so we point baseurl at the CDN
; directly and raise both timeouts.
;
; Hash files (.sha256) are resolved separately, against trusted_mirrors, which is
; why it stays on the official site: the CDN does not serve them.
[aqt]
baseurl : https://qt.mirror.constant.com
connection_timeout : 30
response_timeout : 600

[mirrors]
trusted_mirrors :
    https://download.qt.io
    https://qt-mirror.dannhauer.de/
